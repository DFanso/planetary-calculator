name: Build ASTRONEX

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: macos-x64
            artifact: astronex-macos
          - os: ubuntu-latest
            target: linux-x64
            artifact: astronex-linux
          - os: windows-latest
            target: windows-x64
            artifact: astronex.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Remove unnecessary dependencies
        run: |
          bun remove @types/bun
          rm -rf node_modules/.cache

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: bun build index.js --compile --outfile astronex

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: bun build index.js --compile --outfile astronex

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: bun build index.js --compile --outfile astronex.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            package.json
            index.js
            App.jsx
            README.md
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
