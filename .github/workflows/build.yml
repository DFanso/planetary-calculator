name: Build ASTRONEX

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun build index.js --compile --outfile astronex
      - uses: actions/upload-artifact@v4
        with:
          name: astronex-macos
          path: astronex
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun build index.js --compile --outfile astronex
      - uses: actions/upload-artifact@v4
        with:
          name: astronex-linux
          path: astronex
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun build index.js --compile --outfile astronex.exe
      - uses: actions/upload-artifact@v4
        with:
          name: astronex-windows
          path: astronex.exe
          retention-days: 30

  release:
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v1
        with:
          files: astronex-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
