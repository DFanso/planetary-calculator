name: Build ASTRONEX

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: astronex-macos
            binary: astronex
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: astronex-linux
            binary: astronex
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: astronex-windows.exe
            binary: astronex.exe
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: astronex-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: astronex-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
