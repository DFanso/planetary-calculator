name: Build ASTRONEX

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
      id-token: write # required by the SignPath GitHub connector (OIDC build verification)
    env:
      # Signing turns on automatically once the SIGNPATH_API_TOKEN secret is added.
      # Until then SIGN == 'false' and every signing step below is skipped, so CI is unchanged.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: astronex-macos
            binary: astronex
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: astronex-linux
            binary: astronex
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: astronex-windows.exe
            binary: astronex.exe
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      # --- Windows code signing via SignPath Foundation ---
      # These three steps run ONLY for the Windows build and ONLY once SIGNPATH_API_TOKEN is set.
      # Set up after SignPath Foundation approval:
      #   - repo secret   SIGNPATH_API_TOKEN          (Settings > Secrets and variables > Actions)
      #   - repo variable SIGNPATH_ORGANIZATION_ID    (Settings > Secrets and variables > Actions > Variables)
      #   - in the SignPath portal, create a project / signing policy / artifact configuration whose
      #     slugs match the three *-slug values below, then adjust them here if you named them differently.
      - name: Upload unsigned Windows binary (for SignPath)
        id: unsigned
        if: matrix.name == 'windows' && env.SIGN == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-windows # excluded from the release (release only globs astronex-*)
          path: ${{ matrix.artifact }}
          retention-days: 1

      - name: Sign Windows binary (SignPath)
        if: matrix.name == 'windows' && env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: astronex
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-exe
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed Windows binary
        if: matrix.name == 'windows' && env.SIGN == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: signed/${{ matrix.artifact }}
          retention-days: 30

      # Default upload: all platforms when signing is off; macOS/Linux always.
      - name: Upload artifact
        if: matrix.name != 'windows' || env.SIGN != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: astronex-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: astronex-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
